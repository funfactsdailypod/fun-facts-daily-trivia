name: Weekday Podcast Feed Agent
on:
  schedule:
    # Runs Monday–Friday at 08:20, 08:50, 09:30, 11:30, and 14:00 UTC (captures 08:10 UTC Megaphone drop + handles queue jitter)
    - cron: '20,50 8 * * 1-5'
    - cron: '30 9,11,14 * * 1-5'
  workflow_dispatch: # Allows manual 1-click run anytime from the GitHub Actions tab
permissions:
  contents: write
jobs:
  sync-new-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check RSS feed & generate trivia with Gemini Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/feed-agent.mjs
      - name: Commit and push updated questions.json if new episodes arrived
        run: |
          if git diff --quiet public/data/questions.json; then
            echo "No new episodes published since last check."
            exit 0
          fi
          git config user.name "Fun Facts Daily Trivia Agent"
          git config user.email "actions@github.com"
          git add public/data/questions.json
          git commit -m "chore(trivia): add latest Fun Facts Daily episode question"
          git push
